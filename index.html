<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velora Accessories</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#111;
    color:white;
}

header{
    text-align:center;
    padding:80px 20px;
    background:linear-gradient(to right,#111,#222);
}

header h1{
    font-size:3rem;
    color:gold;
}

header p{
    margin-top:15px;
    font-size:1.2rem;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:gold;
    color:black;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
}

.products{
    padding:60px 20px;
    text-align:center;
}

.products h2{
    color:gold;
    margin-bottom:30px;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    background:#1d1d1d;
    width:250px;
    padding:20px;
    border-radius:15px;
}

.card img{
    width:100%;
    border-radius:10px;
}

.contact{
    text-align:center;
    padding:60px 20px;
}

footer{
    text-align:center;
    padding:20px;
    background:#000;
}
</style>
</head>

<body>

<header>
    <h1>Velora Accessories</h1>
    <p>Elegant Accessories for Every Style</p>
    <a href="https://instagram.com/" class="btn">Shop Now</a>
</header>

<section class="products">
    <h2>Our Collection</h2>

    <div class="cards">
        <div class="card">
            <img src="https://via.placeholder.com/250" alt="">
            <h3>Jewelry</h3>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/250" alt="">
            <h3>Watches</h3>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/250" alt="">
            <h3>Bags</h3>
        </div>
    </div>
</section>

<section class="contact">
    <h2>Contact Us</h2>
    <p>📩 Instagram: @velora_accessories</p>
    <p>📍 Rabat, Morocco</p>
</section>

<footer>
    <p>© 2026 Velora Accessories. All rights reserved.</p>
</footer>

</body>
</html>
